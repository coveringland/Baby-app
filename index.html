<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff4c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Luma Sleep" />
    <title>Luma Sleep</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #263047;
        --muted: #5c6480;
        --paper: #fff7dc;
        --crayon-sky: #8fd0ff;
        --crayon-coral: #ff8f70;
        --crayon-pink: #ffbad0;
        --crayon-yellow: #ffd95d;
        --crayon-mint: #8ee0ad;
        --crayon-lilac: #bba7ff;
        --line: #263047;
        --shadow: 7px 9px 0 rgba(14, 19, 43, 0.38);
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        background:
          linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 22px 22px,
          linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 22px 22px,
          radial-gradient(circle at 22% 9%, rgba(255,217,93,.24), transparent 16rem),
          radial-gradient(circle at 80% 16%, rgba(187,167,255,.26), transparent 15rem),
          linear-gradient(145deg, #20274f 0%, #182040 58%, #131936 100%);
        color: var(--ink);
        font-family: "Comic Sans MS", "Trebuchet MS", ui-rounded, system-ui, sans-serif;
        letter-spacing: 0;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: .24;
        background-image:
          repeating-linear-gradient(13deg, transparent 0 12px, rgba(255,247,220,.16) 13px 14px),
          repeating-linear-gradient(103deg, transparent 0 18px, rgba(255,186,208,.1) 19px 20px);
        mix-blend-mode: soft-light;
      }
      button {
        border: 0;
        font: inherit;
        color: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .app-shell {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .phone-frame {
        position: relative;
        width: min(100%, 430px);
        min-height: min(920px, calc(100svh - 32px));
        max-height: 920px;
        overflow: auto;
        scrollbar-width: none;
        border: 3px solid var(--line);
        border-radius: 34px 30px 38px 28px;
        background:
          radial-gradient(circle at 18% 4%, rgba(255,217,93,.55), transparent 6.5rem),
          linear-gradient(180deg, #fff4c7 0%, #ffeec0 42%, #ffe5d6 100%);
        box-shadow: var(--shadow);
        padding: 22px 18px 24px;
      }
      .phone-frame::before, .phone-frame::after {
        content: "";
        position: absolute;
        pointer-events: none;
        border: 3px solid var(--line);
      }
      .phone-frame::before {
        top: 18px;
        right: 21px;
        width: 31px;
        height: 31px;
        border-radius: 50%;
        background: var(--crayon-yellow);
        box-shadow: -18px 35px 0 -12px var(--crayon-pink), 15px 67px 0 -13px var(--crayon-sky);
        transform: rotate(-10deg);
      }
      .phone-frame::after {
        top: 92px;
        left: -9px;
        width: 31px;
        height: 11px;
        border-radius: 999px;
        background: var(--crayon-mint);
        transform: rotate(-14deg);
      }
      .phone-frame::-webkit-scrollbar { display: none; }
      .baby-header, .status-topline, .section-heading, .nap-window, .quick-stats, .timeline-card, .timeline-actions {
        display: flex;
        align-items: center;
      }
      .baby-header {
        justify-content: space-between;
        gap: 16px;
        padding: 4px 2px 12px;
      }
      .eyebrow, .small-muted, .muted, .timeline-time, .timeline-card p, .nap-window p, .quick-stats p, .insight-card p {
        color: var(--muted);
      }
      .eyebrow {
        display: inline-block;
        margin: 0 0 5px;
        font-size: .78rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .08rem;
        transform: rotate(-1.5deg);
      }
      h1, h2, h3, p { margin-top: 0; }
      h1 {
        margin-bottom: 2px;
        color: #222c55;
        font-size: clamp(2.1rem, 12vw, 3.3rem);
        line-height: .95;
        letter-spacing: 0;
        text-shadow: 2px 2px 0 #ffd95d;
        transform: rotate(-2deg);
      }
      h2 { margin-bottom: 6px; font-size: 1.2rem; line-height: 1.15; }
      h3 { margin-bottom: 4px; font-size: 1rem; }
      .muted { margin-bottom: 0; font-size: .96rem; }
      .icon-button, .mini-button {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        background: var(--paper);
        border: 3px solid var(--line);
        box-shadow: 3px 4px 0 rgba(38,48,71,.28);
      }
      .icon-button {
        width: 54px;
        height: 54px;
        border-radius: 18px 16px 20px 15px;
        color: #4b5fc4;
        transform: rotate(4deg);
      }
      svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2.35;
      }
      .local-note {
        position: relative;
        z-index: 1;
        margin-bottom: 14px;
        border: 3px solid var(--line);
        border-radius: 999px 860px 999px 940px;
        background: #d6f7de;
        box-shadow: 3px 4px 0 rgba(38,48,71,.22);
        color: #222c55;
        padding: 9px 12px;
        font-size: .86rem;
        font-weight: 850;
        line-height: 1.25;
        transform: rotate(-.8deg);
      }
      .status-card {
        position: relative;
        overflow: hidden;
        border-radius: 28px 23px 31px 22px;
        background: linear-gradient(115deg, rgba(255,255,255,.2), transparent 36%), var(--crayon-sky);
        padding: 18px;
        border: 3px solid var(--line);
        box-shadow: var(--shadow);
        transform: rotate(-.6deg);
      }
      .status-card::before {
        content: "";
        position: absolute;
        right: -18px;
        bottom: -14px;
        width: 126px;
        height: 70px;
        border: 3px solid rgba(38,48,71,.32);
        border-radius: 50%;
        background: rgba(255,217,93,.58);
        transform: rotate(-13deg);
      }
      .status-card > * { position: relative; }
      .status-topline { justify-content: space-between; gap: 10px; margin-bottom: 23px; }
      .status-pill, .confidence {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        border: 3px solid var(--line);
        border-radius: 999px 900px 999px 880px;
        padding: 0 12px;
        font-size: .88rem;
        font-weight: 850;
        box-shadow: 3px 3px 0 rgba(38,48,71,.2);
      }
      .status-pill {
        background: var(--crayon-yellow);
        color: #222c55;
        transform: rotate(-3deg);
      }
      .status-pill.sleeping { background: var(--crayon-lilac); }
      .small-muted {
        color: #303a62;
        font-size: .84rem;
        font-weight: 750;
        text-align: right;
      }
      .timer {
        margin: 0 0 18px;
        color: #222c55;
        font-size: clamp(4.25rem, 22vw, 6.45rem);
        font-weight: 900;
        line-height: .9;
        letter-spacing: 0;
        text-shadow: 3px 3px 0 #fff7dc, 6px 6px 0 rgba(38,48,71,.14);
      }
      .primary-action {
        width: 100%;
        min-height: 68px;
        border: 3px solid var(--line);
        border-radius: 24px 20px 26px 19px;
        background: var(--crayon-coral);
        color: #182040;
        font-size: 1.2rem;
        font-weight: 900;
        box-shadow: 5px 6px 0 rgba(38,48,71,.32);
        transform: rotate(.8deg);
      }
      .primary-action:active {
        transform: translate(3px, 3px) rotate(.8deg);
        box-shadow: 2px 3px 0 rgba(38,48,71,.34);
      }
      .primary-action.sleeping { background: var(--crayon-lilac); }
      .nap-window {
        justify-content: space-between;
        gap: 14px;
        margin-top: 17px;
        border: 3px solid var(--line);
        border-radius: 23px 27px 20px 29px;
        padding: 16px;
        background: var(--paper);
        box-shadow: 5px 6px 0 rgba(38,48,71,.22);
        transform: rotate(.8deg);
      }
      .nap-window h2 { color: #25315e; font-size: 1.53rem; }
      .nap-window p { margin-bottom: 0; font-size: .94rem; line-height: 1.4; }
      .confidence {
        align-self: flex-start;
        justify-content: center;
        min-width: 78px;
        color: #182040;
        transform: rotate(4deg);
      }
      .confidence.high { background: var(--crayon-mint); }
      .confidence.medium { background: var(--crayon-yellow); }
      .confidence.low { background: var(--crayon-pink); }
      .quick-stats { gap: 12px; margin-top: 15px; }
      .quick-stats article {
        flex: 1;
        min-height: 95px;
        border: 3px solid var(--line);
        border-radius: 22px 18px 24px 19px;
        background: #ffdff0;
        box-shadow: 4px 5px 0 rgba(38,48,71,.22);
        padding: 15px;
      }
      .quick-stats article:nth-child(2) { background: #d6f7de; transform: rotate(1.5deg); }
      .quick-stats article:first-child { transform: rotate(-1deg); }
      .quick-stats span {
        display: block;
        margin-bottom: 5px;
        color: #222c55;
        font-size: 1.65rem;
        font-weight: 900;
      }
      .quick-stats p { margin-bottom: 0; font-size: .9rem; font-weight: 750; }
      .timeline-section, .insights-section { margin-top: 23px; }
      .section-heading {
        justify-content: space-between;
        gap: 10px;
        min-height: 44px;
        margin-bottom: 8px;
      }
      .section-heading h2 {
        margin-bottom: 0;
        color: #222c55;
        font-weight: 900;
        transform: rotate(-1.5deg);
      }
      .section-actions { display: flex; align-items: center; gap: 8px; }
      .text-button {
        min-height: 42px;
        border: 3px solid var(--line);
        border-radius: 999px 860px 999px 940px;
        padding: 0 15px;
        background: var(--crayon-yellow);
        color: #222c55;
        box-shadow: 3px 4px 0 rgba(38,48,71,.22);
        font-size: .94rem;
        font-weight: 850;
        transform: rotate(2deg);
      }
      .text-button.secondary { background: #d8cfff; transform: rotate(-1deg); }
      .timeline { display: grid; gap: 11px; padding: 0; margin: 0; list-style: none; }
      .timeline-item {
        display: grid;
        grid-template-columns: 62px 1fr;
        gap: 10px;
        align-items: stretch;
      }
      .timeline-time { padding-top: 15px; font-size: .82rem; font-weight: 850; }
      .timeline-card {
        min-height: 74px;
        justify-content: space-between;
        gap: 10px;
        border: 3px solid var(--line);
        border-radius: 19px 22px 17px 21px;
        background: var(--paper);
        box-shadow: 4px 5px 0 rgba(38,48,71,.2);
        padding: 13px;
      }
      .timeline-item:nth-child(2n) .timeline-card { background: #e0f3ff; transform: rotate(-.8deg); }
      .timeline-item:nth-child(2n+1) .timeline-card { transform: rotate(.7deg); }
      .timeline-card p { margin-bottom: 0; font-size: .87rem; line-height: 1.35; }
      .timeline-actions { gap: 7px; }
      .mini-button {
        width: 40px;
        height: 40px;
        border-radius: 14px 16px 13px 15px;
        color: #222c55;
      }
      .mini-button:nth-child(1) { background: #d8cfff; }
      .mini-button:nth-child(2) { background: #ffc5b4; }
      .mini-button svg { width: 18px; height: 18px; }
      .insight-grid { display: grid; gap: 11px; }
      .insight-card {
        border: 3px solid var(--line);
        border-radius: 18px 23px 21px 17px;
        background: #fff7dc;
        box-shadow: 4px 5px 0 rgba(38,48,71,.2);
        padding: 14px;
      }
      .insight-card:nth-child(2) { background: #d6f7de; transform: rotate(.9deg); }
      .insight-card:nth-child(3) { background: #e0f3ff; transform: rotate(-.7deg); }
      .insight-card h3 { color: #222c55; font-size: .98rem; }
      .insight-card p { margin-bottom: 0; font-size: .91rem; line-height: 1.42; }
      button:disabled { cursor: not-allowed; filter: saturate(.55); opacity: .68; }
      button:focus-visible { outline: 4px dashed #fff7dc; outline-offset: 4px; }
      @media (max-width: 390px) {
        .app-shell { padding: 0; }
        .phone-frame {
          min-height: 100svh;
          border-radius: 0;
          border-width: 0;
          box-shadow: none;
        }
        .phone-frame::before { right: 17px; }
        .nap-window { align-items: flex-start; flex-direction: column; }
        .confidence { align-self: auto; }
      }
    </style>
  </head>
  <body>
    <main class="app-shell" aria-label="Baby sleep tracker">
      <section class="phone-frame">
        <header class="baby-header">
          <div>
            <p class="eyebrow">Today</p>
            <h1 id="babyName">Mila</h1>
            <p id="babyAge" class="muted">4 months</p>
          </div>
          <button class="icon-button" aria-label="Open baby profile">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" />
              <path d="M4 21a8 8 0 0 1 16 0" />
            </svg>
          </button>
        </header>
        <section class="local-note" aria-live="polite">
          Saves on this phone. No backend needed.
        </section>
        <section class="status-card" aria-live="polite">
          <div class="status-topline">
            <span id="statusPill" class="status-pill">Awake</span>
            <span id="lastEvent" class="small-muted">Ready</span>
          </div>
          <h2 id="statusTitle">Wake window</h2>
          <p id="mainTimer" class="timer">--</p>
          <button id="primaryAction" class="primary-action">Start Sleep</button>
        </section>
        <section class="nap-window" aria-labelledby="napWindowTitle">
          <div>
            <p class="eyebrow">Suggested next nap</p>
            <h2 id="napWindowTitle">--</h2>
            <p id="napReason">A gentle suggestion will appear here.</p>
          </div>
          <span id="confidence" class="confidence medium">Medium</span>
        </section>
        <section class="quick-stats" aria-label="Sleep summary">
          <article>
            <span id="todaySleep">--</span>
            <p>slept today</p>
          </article>
          <article>
            <span id="lastNap">--</span>
            <p>last nap</p>
          </article>
        </section>
        <section class="timeline-section" aria-labelledby="timelineTitle">
          <div class="section-heading">
            <h2 id="timelineTitle">Today</h2>
            <div class="section-actions">
              <button id="resetDemo" class="text-button secondary">Reset</button>
              <button id="addMockSession" class="text-button">Add nap</button>
            </div>
          </div>
          <ol id="timeline" class="timeline"></ol>
        </section>
        <section class="insights-section" aria-labelledby="insightsTitle">
          <div class="section-heading">
            <h2 id="insightsTitle">Gentle notes</h2>
          </div>
          <div id="insights" class="insight-grid"></div>
        </section>
      </section>
    </main>
    <template id="timelineItemTemplate">
      <li class="timeline-item">
        <div class="timeline-time"></div>
        <div class="timeline-card">
          <div>
            <h3></h3>
            <p></p>
          </div>
          <div class="timeline-actions">
            <button class="mini-button edit-button" aria-label="Edit session">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m4 20 4.8-1L19.2 8.6a2.3 2.3 0 0 0-3.3-3.3L5.5 15.7 4 20Z" />
                <path d="m14.5 6.7 2.8 2.8" />
              </svg>
            </button>
            <button class="mini-button delete-button" aria-label="Delete session">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16" />
                <path d="M10 11v6" />
                <path d="M14 11v6" />
                <path d="M6 7l1 14h10l1-14" />
                <path d="M9 7V4h6v3" />
              </svg>
            </button>
          </div>
        </div>
      </li>
    </template>
    <script>
      const STORE_KEY = "luma_sleep_standalone_v1";
      const baby = { id: "baby_mila", name: "Mila", birthDate: "2026-05-02" };
      const els = {
        babyName: document.querySelector("#babyName"),
        babyAge: document.querySelector("#babyAge"),
        statusPill: document.querySelector("#statusPill"),
        statusTitle: document.querySelector("#statusTitle"),
        lastEvent: document.querySelector("#lastEvent"),
        mainTimer: document.querySelector("#mainTimer"),
        primaryAction: document.querySelector("#primaryAction"),
        napWindowTitle: document.querySelector("#napWindowTitle"),
        napReason: document.querySelector("#napReason"),
        confidence: document.querySelector("#confidence"),
        todaySleep: document.querySelector("#todaySleep"),
        lastNap: document.querySelector("#lastNap"),
        timeline: document.querySelector("#timeline"),
        insights: document.querySelector("#insights"),
        addMockSession: document.querySelector("#addMockSession"),
        resetDemo: document.querySelector("#resetDemo"),
        timelineTemplate: document.querySelector("#timelineItemTemplate"),
      };
      let sessions = loadSessions();

      function minutesAgo(totalMinutes) {
        const date = new Date();
        date.setMinutes(date.getMinutes() - totalMinutes, 0, 0);
        return date.toISOString();
      }
      function seedSessions() {
        return [
          { id: crypto.randomUUID(), babyId: baby.id, startTime: minutesAgo(543), endTime: minutesAgo(496), type: "nap", location: "crib", wakeMood: "happy" },
          { id: crypto.randomUUID(), babyId: baby.id, startTime: minutesAgo(370), endTime: minutesAgo(328), type: "nap", location: "contact", wakeMood: "neutral" },
          { id: crypto.randomUUID(), babyId: baby.id, startTime: minutesAgo(121), endTime: minutesAgo(82), type: "nap", location: "stroller", wakeMood: "fussy" },
        ];
      }
      function loadSessions() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
          return Array.isArray(saved) ? saved : seedSessions();
        } catch {
          return seedSessions();
        }
      }
      function saveSessions() {
        localStorage.setItem(STORE_KEY, JSON.stringify(sessions));
      }
      function minutesBetween(start, end = new Date()) {
        if (!start) return 0;
        return Math.max(0, Math.round((new Date(end) - new Date(start)) / 60000));
      }
      function formatDuration(totalMinutes = 0) {
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        if (hours === 0) return `${minutes}m`;
        return `${hours}h ${minutes}m`;
      }
      function formatTime(value) {
        if (!value) return "--";
        return new Intl.DateTimeFormat("en", { hour: "numeric", minute: "2-digit" }).format(new Date(value));
      }
      function ageLabel(birthDate) {
        const born = new Date(birthDate);
        const now = new Date();
        const months = (now.getFullYear() - born.getFullYear()) * 12 + now.getMonth() - born.getMonth();
        const weeks = Math.max(0, Math.floor((now.getDate() - born.getDate()) / 7));
        return `${months} months${weeks ? `, ${weeks} week` : ""}${weeks === 1 ? "" : weeks ? "s" : ""}`;
      }
      function napNumberToday() {
        const today = new Date().toDateString();
        return sessions.filter((session) => new Date(session.startTime).toDateString() === today).length + 1;
      }
      function summary() {
        const sorted = [...sessions].sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
        const active = sorted.find((session) => !session.endTime);
        const completed = sorted.filter((session) => session.endTime);
        const lastCompleted = completed[completed.length - 1];
        const wakeMinutes = active ? 0 : lastCompleted ? minutesBetween(lastCompleted.endTime) : 0;
        const today = new Date().toDateString();
        const todaySleep = sorted
          .filter((session) => new Date(session.startTime).toDateString() === today)
          .reduce((total, session) => total + minutesBetween(session.startTime, session.endTime || new Date()), 0);
        const recentWakeWindows = [];
        for (let index = 1; index < completed.length; index += 1) {
          const previous = completed[index - 1];
          const current = completed[index];
          const gap = minutesBetween(previous.endTime, current.startTime);
          if (gap >= 30 && gap <= 240) recentWakeWindows.push(gap);
        }
        const defaultWake = napNumberToday() <= 2 ? 105 : 120;
        const samples = recentWakeWindows.slice(-4);
        const averageWake = samples.length
          ? Math.round(samples.reduce((total, item) => total + item, 0) / samples.length)
          : defaultWake;
        const napStart = active
          ? new Date(new Date(active.startTime).getTime() + 45 * 60000)
          : new Date(new Date(lastCompleted?.endTime || Date.now()).getTime() + averageWake * 60000);
        const napEnd = new Date(napStart.getTime() + 30 * 60000);
        const confidence = samples.length >= 3 ? "high" : samples.length >= 1 ? "medium" : "low";
        return {
          currentlySleeping: Boolean(active),
          currentWakeWindowMinutes: wakeMinutes,
          todaySleepMinutes: todaySleep,
          lastSleep: sorted[sorted.length - 1],
          nextNapWindow: {
            startTime: napStart.toISOString(),
            endTime: napEnd.toISOString(),
            confidence,
            reason: active
              ? "If this nap is short, the next window may land a bit earlier."
              : samples.length
                ? "Based on the naps saved on this phone."
                : "Starting with a gentle age-based estimate.",
          },
          insights: buildInsights(todaySleep, wakeMinutes, lastCompleted),
        };
      }
      function buildInsights(todaySleep, wakeMinutes, lastCompleted) {
        const lastNapMinutes = lastCompleted ? minutesBetween(lastCompleted.startTime, lastCompleted.endTime) : 0;
        return [
          {
            id: "window",
            title: wakeMinutes > 125 ? "Offer a calm wind-down" : "Nice steady window",
            body: wakeMinutes > 125
              ? "The current wake window is stretching long. A quiet room may help."
              : "There is still a little room for feeding and settling.",
          },
          {
            id: "today",
            title: "Day sleep so far",
            body: `${formatDuration(todaySleep)} logged today. Keep it flexible.`,
          },
          {
            id: "last",
            title: lastNapMinutes < 45 ? "Short nap noted" : "Restful last nap",
            body: lastNapMinutes < 45
              ? "A shorter nap can mean the next sleepy cue shows up sooner."
              : "That last stretch was long enough to take the edge off.",
          },
        ];
      }
      function render() {
        const data = summary();
        const active = sessions.find((session) => !session.endTime);
        const lastCompleted = [...sessions].reverse().find((session) => session.endTime);
        els.babyName.textContent = baby.name;
        els.babyAge.textContent = ageLabel(baby.birthDate);
        els.statusPill.textContent = data.currentlySleeping ? "Sleeping" : "Awake";
        els.statusPill.classList.toggle("sleeping", data.currentlySleeping);
        els.statusTitle.textContent = data.currentlySleeping ? "Current sleep" : "Wake window";
        els.mainTimer.textContent = data.currentlySleeping
          ? formatDuration(minutesBetween(active?.startTime))
          : formatDuration(data.currentWakeWindowMinutes);
        els.primaryAction.textContent = data.currentlySleeping ? "Baby Woke Up" : "Start Sleep";
        els.primaryAction.classList.toggle("sleeping", data.currentlySleeping);
        els.lastEvent.textContent = data.currentlySleeping
          ? `Started ${formatTime(active?.startTime)}`
          : lastCompleted
            ? `Woke ${formatDuration(minutesBetween(lastCompleted.endTime))} ago`
            : "Ready to log";
        els.napWindowTitle.textContent = `${formatTime(data.nextNapWindow.startTime)} - ${formatTime(data.nextNapWindow.endTime)}`;
        els.napReason.textContent = data.nextNapWindow.reason;
        els.confidence.textContent = capitalize(data.nextNapWindow.confidence);
        els.confidence.className = `confidence ${data.nextNapWindow.confidence}`;
        els.todaySleep.textContent = formatDuration(data.todaySleepMinutes);
        els.lastNap.textContent = lastCompleted ? formatDuration(minutesBetween(lastCompleted.startTime, lastCompleted.endTime)) : "0m";
        renderTimeline();
        renderInsights(data.insights);
      }
      function renderTimeline() {
        els.timeline.replaceChildren();
        const sorted = [...sessions].sort((a, b) => new Date(b.startTime) - new Date(a.startTime));
        if (!sorted.length) {
          const item = document.createElement("li");
          item.className = "timeline-item";
          item.innerHTML = `<div class="timeline-time">--</div><div class="timeline-card"><div><h3>No naps yet</h3><p>Tap Start Sleep when baby dozes off.</p></div></div>`;
          els.timeline.append(item);
          return;
        }
        sorted.forEach((session) => {
          const item = els.timelineTemplate.content.firstElementChild.cloneNode(true);
          const title = session.endTime ? `${capitalize(session.type)} · ${formatDuration(minutesBetween(session.startTime, session.endTime))}` : "Sleeping now";
          const details = session.endTime
            ? `${formatTime(session.startTime)} - ${formatTime(session.endTime)} · ${formatLocation(session.location)}`
            : `Started ${formatTime(session.startTime)} · ${formatLocation(session.location)}`;
          item.querySelector(".timeline-time").textContent = formatTime(session.startTime);
          item.querySelector("h3").textContent = title;
          item.querySelector("p").textContent = details;
          item.querySelector(".edit-button").disabled = !session.endTime;
          item.querySelector(".edit-button").addEventListener("click", () => editSession(session.id));
          item.querySelector(".delete-button").addEventListener("click", () => deleteSession(session.id));
          els.timeline.append(item);
        });
      }
      function renderInsights(insights) {
        els.insights.replaceChildren();
        insights.forEach((insight) => {
          const card = document.createElement("article");
          card.className = "insight-card";
          const title = document.createElement("h3");
          const body = document.createElement("p");
          title.textContent = insight.title;
          body.textContent = insight.body;
          card.append(title, body);
          els.insights.append(card);
        });
      }
      function toggleSleep() {
        const active = sessions.find((session) => !session.endTime);
        if (active) {
          active.endTime = new Date().toISOString();
          active.wakeMood = "neutral";
        } else {
          sessions.push({
            id: crypto.randomUUID(),
            babyId: baby.id,
            startTime: new Date().toISOString(),
            type: "nap",
            location: "crib",
          });
        }
        saveSessions();
        render();
      }
      function addManualSession() {
        const start = new Date(Date.now() - 62 * 60000);
        const end = new Date(Date.now() - 24 * 60000);
        sessions.push({
          id: crypto.randomUUID(),
          babyId: baby.id,
          startTime: start.toISOString(),
          endTime: end.toISOString(),
          type: "nap",
          location: "carrier",
          wakeMood: "happy",
        });
        saveSessions();
        render();
      }
      function editSession(id) {
        sessions = sessions.map((session) => {
          if (session.id !== id || !session.endTime) return session;
          return { ...session, endTime: new Date(new Date(session.endTime).getTime() + 5 * 60000).toISOString() };
        });
        saveSessions();
        render();
      }
      function deleteSession(id) {
        sessions = sessions.filter((session) => session.id !== id);
        saveSessions();
        render();
      }
      function resetDemo() {
        sessions = seedSessions();
        saveSessions();
        render();
      }
      function formatLocation(location) {
        if (!location) return "noted";
        return location === "contact" ? "contact nap" : location;
      }
      function capitalize(value = "") {
        return value.charAt(0).toUpperCase() + value.slice(1);
      }
      els.primaryAction.addEventListener("click", toggleSleep);
      els.addMockSession.addEventListener("click", addManualSession);
      els.resetDemo.addEventListener("click", resetDemo);
      render();
      setInterval(render, 30000);
    </script>
  </body>
</html>
